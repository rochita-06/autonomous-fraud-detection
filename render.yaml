services:
  # ==========================================
  # Backend Service (FastAPI)
  # ==========================================
  - type: web
    name: fraud-investigation-backend
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: CORS_ORIGINS
        value: "*"
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-opus-4-8
      - key: FRAUD_BLOCK_THRESHOLD
        value: "0.8"
      - key: FRAUD_REVIEW_THRESHOLD
        value: "0.5"

  # ==========================================
  # Frontend Service (Next.js Dashboard)
  # ==========================================
  - type: web
    name: fraud-investigation-frontend
    env: node
    region: oregon
    plan: free
    buildCommand: "cd frontend && npm install && npm run build"
    startCommand: "cd frontend && npm start"
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NEXT_PUBLIC_API_URL
        sync: false # Set this to your backend Render URL (e.g. https://fraud-investigation-backend.onrender.com)
